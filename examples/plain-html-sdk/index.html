<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Avatar Studio SDK Example</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 24px;
        color: #26221e;
        background: #f5f0e8;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        display: grid;
        gap: 18px;
        max-width: 1120px;
        margin: 0 auto;
      }

      #avatar {
        height: 720px;
        overflow: hidden;
        border: 1px solid rgba(99, 88, 75, 0.16);
        border-radius: 18px;
        background: #fffdfa;
      }

      button {
        width: max-content;
        min-height: 42px;
        border: 0;
        border-radius: 999px;
        padding: 0 16px;
        color: #fffdfa;
        background: #2f5f5b;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }

      pre {
        overflow: auto;
        min-height: 120px;
        border-radius: 14px;
        padding: 14px;
        color: #f8f2e8;
        background: #1f2725;
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <h1>Avatar Studio SDK</h1>
        <p>Plain HTML integration using the browser global bundle.</p>
      </div>

      <button id="open-modal" type="button">Open creator modal</button>
      <div id="avatar"></div>
      <pre id="event-output">Save an avatar to see the AVATAR_CREATED payload.</pre>
    </main>

    <script src="../../packages/avatar-sdk/dist/avatar-studio.iife.js"></script>
    <script>
      const output = document.querySelector("#event-output");

      const onAvatarCreated = (event) => {
        output.textContent = JSON.stringify(event, null, 2);
      };

      const handle = AvatarStudio.init({
        container: "#avatar",
        clientId: "demo",
        externalUserId: "plain_html_user",
        studioBaseUrl: "http://localhost:5173",
        onAvatarCreated,
        onError: (error) => {
          output.textContent = error.message;
        }
      });

      document.querySelector("#open-modal").addEventListener("click", () => {
        AvatarStudio.openModal({
          clientId: "demo",
          externalUserId: "plain_html_modal_user",
          studioBaseUrl: "http://localhost:5173",
          onAvatarCreated,
          onError: (error) => {
            output.textContent = error.message;
          }
        });
      });

      window.addEventListener("beforeunload", () => handle.destroy());
    </script>
  </body>
</html>
