services:
  postgres:
    image: postgres:16-alpine
    container_name: avatar-platform-postgres
    environment:
      POSTGRES_DB: avatar_platform
      POSTGRES_USER: avatar_user
      POSTGRES_PASSWORD: avatar_password
    ports:
      - "5433:5432"
    volumes:
      - avatar_platform_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avatar_user -d avatar_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  avatar_platform_postgres_data:
